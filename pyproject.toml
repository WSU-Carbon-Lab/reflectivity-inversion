[project]
name = "ml-reflectivity"
version = "0.1.0"
description = "Refltron: neural-network inversion of polarized X-ray reflectivity into thin-film parameters"
readme = "README.md"
authors = [
    { name = "Harlan D Heilman", email = "73567020+HarlanHeilman@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "huggingface-hub>=1.0.0",
    "matplotlib>=3.11.2",
    "periodictable>=2.1.0",
    "polars>=2.1.0",
    "pyarrow>=20.0.0",
    "refloxide[plugin]>=0.3.0",
    "safetensors>=0.8.0",
    "torch>=2.15.0",
    "wandb>=0.31.0",
]

[tool.uv]
# Not installed: run the code from the project folder as modules, e.g.
#   uv run python -m refltron.single_channel_mlp.train --input s
package = false

